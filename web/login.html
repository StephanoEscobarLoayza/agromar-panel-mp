<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Entrar · Agromar</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-bg{position:fixed;inset:0;z-index:0;
    background:var(--forest) url("/login-bg.jpg") center/cover no-repeat;
    filter:blur(3px) saturate(1.12) brightness(1.02);transform:scale(1.06)}
  /* dos capas: un tinte forest suave parejo + un viñeteado que oscurece solo
     los bordes, así la foto se ve pero el marco queda contenido */
  .login-bg::after{content:"";position:absolute;inset:0;
    background:
      radial-gradient(135% 130% at 50% 32%, rgba(18,53,36,.10) 0%, rgba(18,53,36,.44) 52%, rgba(12,36,25,.80) 100%),
      linear-gradient(180deg, rgba(18,53,36,.28), rgba(18,53,36,.20))}
  .login-motes{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
  .login-card{position:relative;z-index:2;width:100%;max-width:404px;overflow:hidden;
    background:var(--surface);border-radius:20px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 30px 70px rgba(8,24,16,.45), 0 6px 18px rgba(8,24,16,.25);
    padding:38px 36px 30px}
  .login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--citrus),var(--forest-2))}
  .login-mark{display:flex;align-items:baseline;gap:2px;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:29px}
  .login-mark .agro{color:var(--citrus)}
  .login-mark .mar{color:var(--text)}
  .login-mark .dot{width:8px;height:8px;border-radius:50%;background:var(--citrus);display:inline-block;margin:0 3px 5px}
  .login-sub{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--text-muted);margin-top:3px}
  .login-title{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600;margin:24px 0 5px;line-height:1.15}
  .login-hint{font-size:13px;color:var(--text-2);margin-bottom:20px;line-height:1.55}
  .login-card label{font-size:12px;color:var(--text-2);font-weight:600;display:block;margin-bottom:6px}
  .login-card input{padding:12px 13px}
  #msg .msg{margin-top:14px}
  .login-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);
    font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:13px;color:var(--foot-accent);text-align:center;letter-spacing:.01em;text-transform:none}
  /* en pantalla vertical (celular y tablet en vertical) la foto horizontal se
     recorta a puro verde - se usa un recorte vertical (silos + naranjas) */
  @media (max-width:820px){
    .login-bg{background-image:url("/login-bg-mobile.jpg");filter:blur(3px) saturate(1.1) brightness(1)}
  }
  @media (max-width:560px){
    .login-card{max-width:none}
  }
</style>
</head>
<body>

<div class="login-bg" id="loginBg"></div>
<canvas class="login-motes" id="motes" aria-hidden="true"></canvas>

<form class="login-card" id="form" autocomplete="on">
  <div>
    <div class="login-mark"><span class="agro">agro</span><span class="dot"></span><span class="mar">mar</span></div>
    <div class="login-sub">Industrial</div>
  </div>

  <div class="login-title">Panel de cuadre de producción</div>
  <div class="login-hint">Ingresa el usuario y la contraseña del equipo para continuar.</div>

  <div class="field">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
  </div>

  <div class="field" style="margin-top:12px">
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autocomplete="current-password">
  </div>

  <div id="msg"></div>

  <button class="btn" id="btn" type="submit" style="margin-top:16px">Entrar</button>

  <div class="login-foot">Del campo a planta, cuadrado al kilo.</div>
</form>

<script>
// motas de luz flotando (tipo polen en un huerto) - siempre se mueven; si el
// equipo pidió "menos movimiento" solo van más lento, no se congelan. Se pausa
// cuando la pestaña no está visible (para no gastar batería en balde).
(function motas() {
  const cv = document.getElementById("motes");
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  const factorMov = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.4 : 1;
  let w = 0, h = 0, dpr = 1, parts = [], raf = null, t = null;

  function nueva() {
    return {
      x: Math.random() * w, y: Math.random() * h,
      r: 0.8 + Math.random() * 2.4,
      vy: -(0.22 + Math.random() * 0.55) * factorMov,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: (0.008 + Math.random() * 0.016) * factorMov,
      swayAmp: (0.35 + Math.random() * 0.75) * factorMov,
      a: 0.16 + Math.random() * 0.38,
      citrus: Math.random() < 0.22,
    };
  }
  function medir() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((w * h) / 20000);
    parts = Array.from({ length: Math.max(20, Math.min(72, n)) }, nueva);
    dibujar();
  }
  function dibujar() {
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + (p.citrus ? "242,169,60," : "244,239,224,") + p.a + ")";
      ctx.fill();
    }
  }
  function paso() {
    for (const p of parts) {
      p.y += p.vy;
      p.sway += p.swaySpeed;
      p.x += Math.sin(p.sway) * p.swayAmp;
      if (p.y < -6) { p.y = h + 6; p.x = Math.random() * w; }
      if (p.x < -6) p.x = w + 6;
      else if (p.x > w + 6) p.x = -6;
    }
    dibujar();
    if (document.hidden) { raf = null; return; }
    raf = requestAnimationFrame(paso);
  }

  medir();
  raf = requestAnimationFrame(paso);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !raf) raf = requestAnimationFrame(paso);
  });
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(medir, 200); });
})();

const form = document.getElementById("form");
const usuario = document.getElementById("usuario");
const pass = document.getElementById("password");
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (!usuario.value || !pass.value) {
    msg.innerHTML = '<div class="msg bad">Escribe usuario y contraseña.</div>';
    return;
  }
  btn.disabled = true;
  msg.innerHTML = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario: usuario.value, password: pass.value }),
    });
    if (res.ok) {
      const destino = new URLSearchParams(location.search).get("next") || "/";
      location.href = destino.startsWith("/") ? destino : "/";
      return;
    }
    const body = await res.json().catch(() => ({}));
    msg.innerHTML = `<div class="msg bad">${body.detail || "No se pudo entrar."}</div>`;
  } catch (e) {
    msg.innerHTML = '<div class="msg bad">Sin conexión. Intenta de nuevo.</div>';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
