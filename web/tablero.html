<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tablero de planta · Agromar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{
    --forest:#123524;
    --text:#F4EFE0; --text-2:#CBDCD1; --text-muted:#93AD9A;
    --citrus:#F2A93C; --citrus-2:#F6C177;
    --ok:#4CC787;
    --bad:#F0776C; --bad-bg:rgba(59,29,27,.72); --bad-line:#B5544A;
    --glass-bg:rgba(13,32,21,.58); --glass-border:rgba(244,239,224,.12);
    --glass-row:rgba(9,24,16,.4);
    --shadow:0 24px 60px rgba(5,15,10,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text);
    font-family:'Public Sans',system-ui,sans-serif;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;text-wrap:balance}
  .num{font-family:'IBM Plex Mono','SFMono-Regular',monospace;font-variant-numeric:tabular-nums}
  a{color:inherit}

  /* ---------- fondo con foto (misma foto/tratamiento que login.html) + motas ---------- */
  .board-bg{position:fixed;inset:0;z-index:0;
    background:var(--forest) url("/login-bg.jpg") center/cover no-repeat;
    filter:blur(3px) saturate(1.12) brightness(.85);transform:scale(1.06)}
  .board-bg::after{content:"";position:absolute;inset:0;
    background:
      radial-gradient(135% 130% at 50% 30%, rgba(18,53,36,.30) 0%, rgba(14,40,27,.58) 55%, rgba(8,22,15,.82) 100%),
      linear-gradient(180deg, rgba(10,28,19,.35), rgba(10,28,19,.30))}
  .board-motes{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
  @media (max-width:820px){
    .board-bg{background-image:url("/login-bg-mobile.jpg")}
  }

  .board{position:relative;z-index:2;width:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

  .glass{background:var(--glass-bg);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);
    border:1px solid var(--glass-border);border-radius:20px;box-shadow:var(--shadow)}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px}
  .mark{display:flex;align-items:baseline;gap:2px;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;text-decoration:none}
  .mark .agro{color:var(--citrus-2)}
  .mark .dot{width:6px;height:6px;border-radius:50%;background:var(--citrus);display:inline-block;margin:0 2px 3px}
  .mark-sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);margin-top:3px}
  .clock{text-align:right}
  .clock .hora{font-size:22px;font-weight:600}
  .clock .fecha{font-size:12px;color:var(--text-muted);margin-top:2px}

  .hero-corrida{padding:30px 32px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap}
  .hc-label{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(76,199,135,.55)}50%{box-shadow:0 0 0 7px rgba(76,199,135,0)}}
  .hc-nombre{font-size:48px;font-weight:700;letter-spacing:-.01em;line-height:1.04}
  .hc-desde{font-size:15px;color:var(--text-2);margin-top:10px}
  .hc-kg{text-align:right}
  .hc-kg .valor{font-size:48px;font-weight:600;color:var(--citrus-2)}
  .hc-kg .etiqueta{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-top:2px}

  .alerta-parada{
    display:none; align-items:center; gap:18px;
    background:var(--bad-bg); border:1px solid var(--bad-line); border-radius:20px;
    padding:22px 28px; box-shadow:var(--shadow); backdrop-filter:blur(16px);
  }
  .alerta-parada.activa{display:flex}
  .alerta-icono{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:var(--bad);display:flex;align-items:center;justify-content:center;
    animation:latido 1.6s ease-in-out infinite}
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .alerta-icono svg{width:24px;height:24px}
  .alerta-texto .titulo{font-size:20px;font-weight:700;color:var(--bad)}
  .alerta-texto .detalle{font-size:14.5px;color:var(--text-2);margin-top:4px}
  .alerta-tiempo{margin-left:auto;text-align:right}
  .alerta-tiempo .valor{font-size:30px;font-weight:600;color:var(--bad)}
  .alerta-tiempo .etiqueta{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}

  .panel-lotes{padding:8px 0 12px}
  .seccion-titulo{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:14px 28px 12px}
  .registros{display:flex;flex-direction:column}
  .registro{display:flex;align-items:center;gap:16px;padding:14px 28px;border-top:1px solid var(--glass-border)}
  .registro:nth-child(even){background:var(--glass-row)}
  .registro .lote{font-size:17px;font-weight:600;min-width:80px}
  .registro .tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(244,239,224,.10);color:var(--text-2);letter-spacing:.03em;white-space:nowrap}
  .registro .proveedor{color:var(--text-2);font-size:14px;flex:1;min-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .registro .kg{font-size:17px;font-weight:600;color:var(--citrus-2);min-width:110px;text-align:right;white-space:nowrap}
  .registro .hace{color:var(--text-muted);font-size:13px;min-width:80px;text-align:right;white-space:nowrap}
  .vacio{padding:22px 28px;color:var(--text-muted);font-size:14.5px}

  .pie{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;font-size:12px;color:var(--text-muted)}
  .pie a{text-decoration:none;color:var(--text-muted)}
  .pie a:hover{color:var(--text-2)}

  /* ---------- tablet ---------- */
  @media (max-width:820px){
    body{padding:20px 14px}
    .board{gap:14px}
    .topbar{padding:14px 20px}
    .mark{font-size:19px}
    .clock .hora{font-size:17px}
    .clock .fecha{font-size:10.5px}
    .hero-corrida{padding:22px 22px;gap:16px}
    .hc-nombre{font-size:34px}
    .hc-desde{font-size:13px;margin-top:8px}
    .hc-kg .valor{font-size:34px}
    .alerta-parada{padding:16px 20px;gap:14px}
    .alerta-icono{width:38px;height:38px}
    .alerta-icono svg{width:20px;height:20px}
    .alerta-texto .titulo{font-size:16px}
    .alerta-texto .detalle{font-size:13px}
    .alerta-tiempo .valor{font-size:23px}
    .seccion-titulo{margin:12px 20px 10px}
    /* una tarjeta por lote pasa a 2 líneas (lote/tipo/kg arriba,
       proveedor/hace abajo) en vez de ir apretando cada columna hasta
       que el proveedor no entre. */
    .registro{
      display:grid; padding:12px 20px; gap:3px 10px;
      grid-template-columns:auto auto 1fr auto;
      grid-template-areas:"lote tag . kg" "prov prov prov hace";
    }
    .registro .lote{grid-area:lote}
    .registro .tag{grid-area:tag}
    .registro .kg{grid-area:kg;min-width:0}
    .registro .proveedor{grid-area:prov;white-space:normal;font-size:12.5px;line-height:1.3;min-width:0}
    .registro .hace{grid-area:hace;min-width:0;font-size:11px}
    .pie{padding:12px 20px;font-size:11px}
  }

  /* ---------- celular ---------- */
  @media (max-width:480px){
    .mark-sub{display:none}
    .hc-nombre{font-size:27px}
    .hc-kg .valor{font-size:27px}
    .hc-kg .etiqueta{font-size:11px}
  }
</style>
</head>
<body>

<div class="board-bg"></div>
<canvas class="board-motes" id="motes" aria-hidden="true"></canvas>

<div class="board">
  <div class="topbar glass">
    <a href="index.html" class="mark" title="Ir a Dashboards">
      <div>
        <div><span class="agro">agro</span><span class="dot"></span><span class="mar">mar</span></div>
        <div class="mark-sub">Tablero de planta</div>
      </div>
    </a>
    <div class="clock">
      <div class="hora num" id="reloj">--:--</div>
      <div class="fecha" id="relojFecha">—</div>
    </div>
  </div>

  <div class="alerta-parada" id="alertaParada">
    <div class="alerta-icono">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5" stroke="#3B1D1B" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="16.4" r="1.15" fill="#3B1D1B"/><path d="M10.6 3.6c.62-1.07 2.18-1.07 2.8 0l8.2 14.2c.62 1.07-.16 2.4-1.4 2.4H3.8c-1.24 0-2.02-1.33-1.4-2.4l8.2-14.2Z" stroke="#3B1D1B" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </div>
    <div class="alerta-texto">
      <div class="titulo">Parada en curso</div>
      <div class="detalle" id="alertaDetalle">—</div>
    </div>
    <div class="alerta-tiempo">
      <div class="valor num" id="alertaTiempo">—</div>
      <div class="etiqueta">parada</div>
    </div>
  </div>

  <div id="contenidoCorrida" class="glass"><div class="vacio">Cargando…</div></div>

  <div class="glass panel-lotes">
    <div class="seccion-titulo">Últimos lotes registrados</div>
    <div id="listaRegistros"><div class="vacio">Cargando…</div></div>
  </div>

  <div class="pie glass">
    <span>Se actualiza solo — no hace falta tocar nada.</span>
    <a href="corridas.html">Ir a Corridas →</a>
  </div>
</div>

<script src="app.js"></script>
<script>
// motas de luz flotando - mismo dibujo que login.html, para que el tablero
// se sienta parte de la misma identidad (foto de planta + partículas), no
// una pantalla técnica aparte.
(function motas() {
  const cv = document.getElementById("motes");
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  const factorMov = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.4 : 1;
  let w = 0, h = 0, dpr = 1, parts = [], raf = null, t = null;

  function nueva() {
    return {
      x: Math.random() * w, y: Math.random() * h,
      r: 0.8 + Math.random() * 2.4,
      vy: -(0.22 + Math.random() * 0.55) * factorMov,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: (0.008 + Math.random() * 0.016) * factorMov,
      swayAmp: (0.35 + Math.random() * 0.75) * factorMov,
      a: 0.16 + Math.random() * 0.38,
      citrus: Math.random() < 0.22,
    };
  }
  function medir() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((w * h) / 20000);
    parts = Array.from({ length: Math.max(20, Math.min(72, n)) }, nueva);
    dibujar();
  }
  function dibujar() {
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + (p.citrus ? "242,169,60," : "244,239,224,") + p.a + ")";
      ctx.fill();
    }
  }
  function paso() {
    for (const p of parts) {
      p.y += p.vy;
      p.sway += p.swaySpeed;
      p.x += Math.sin(p.sway) * p.swayAmp;
      if (p.y < -6) { p.y = h + 6; p.x = Math.random() * w; }
      if (p.x < -6) p.x = w + 6;
      else if (p.x > w + 6) p.x = -6;
    }
    dibujar();
    if (document.hidden) { raf = null; return; }
    raf = requestAnimationFrame(paso);
  }

  medir();
  raf = requestAnimationFrame(paso);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !raf) raf = requestAnimationFrame(paso);
  });
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(medir, 200); });
})();

const REFRESCO_DATOS_MS = 45000;

let estado = { corrida: null, registros: [], paradaActiva: null };

function fmtHoraReloj(d) {
  return d.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
}
function fmtFechaReloj(d) {
  const s = d.toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "long" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function transcurrido(desde) {
  const ms = Date.now() - new Date(desde).getTime();
  const min = Math.max(0, Math.round(ms / 60000));
  if (min < 60) return `${min}m`;
  const h = Math.floor(min / 60), m = min % 60;
  return `${h}h ${m}m`;
}
function haceTexto(desde) {
  const ms = Date.now() - new Date(desde).getTime();
  const min = Math.max(0, Math.round(ms / 60000));
  if (min < 1) return "recién";
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return `hace ${h}h${m ? " " + m + "m" : ""}`;
}
function tagAlmacen(t) {
  return t === "BINES" ? "Bines" : t === "SILO" ? "Silo" : "—";
}

function actualizarReloj() {
  const ahora = new Date();
  document.getElementById("reloj").textContent = fmtHoraReloj(ahora);
  document.getElementById("relojFecha").textContent = fmtFechaReloj(ahora);
}

function renderizar() {
  const contCorrida = document.getElementById("contenidoCorrida");
  const contRegistros = document.getElementById("listaRegistros");
  const alerta = document.getElementById("alertaParada");

  if (estado.paradaActiva) {
    alerta.classList.add("activa");
    const p = estado.paradaActiva;
    document.getElementById("alertaDetalle").textContent =
      [p.tipo_parada, p.area_proceso].filter(Boolean).join(" · ") || "Sin detalle registrado";
    document.getElementById("alertaTiempo").textContent = transcurrido(p.hora_inicio);
  } else {
    alerta.classList.remove("activa");
  }

  if (!estado.corrida) {
    contCorrida.innerHTML = '<div class="vacio">No hay ninguna corrida en curso ahora mismo.</div>';
    contRegistros.innerHTML = '<div class="vacio">—</div>';
    return;
  }

  const c = estado.corrida;
  contCorrida.innerHTML = `
    <div class="hero-corrida">
      <div>
        <div class="hc-label"><span class="live-dot"></span> Corrida en curso</div>
        <h1 class="hc-nombre">${escapeHtml(c.nombre)}</h1>
        <div class="hc-desde">Desde las ${new Date(c.fecha_inicio).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" })} · hace ${transcurrido(c.fecha_inicio)}</div>
      </div>
      <div class="hc-kg">
        <div class="valor num">${fmtKg(c.kg_asignados_total)}</div>
        <div class="etiqueta">kg registrados</div>
      </div>
    </div>
  `;

  if (!estado.registros.length) {
    contRegistros.innerHTML = '<div class="vacio">Todavía no hay ningún lote registrado en esta corrida.</div>';
    return;
  }
  contRegistros.innerHTML = `<div class="registros">${estado.registros.map((a) => `
    <div class="registro">
      <div class="lote num">#${a.lote_numero}</div>
      <div class="tag">${tagAlmacen(a.tipo_almacen_origen)}</div>
      <div class="proveedor">${escapeHtml(a.proveedor || "—")}</div>
      <div class="kg num">${a.kg_asignados !== null ? fmtKg(a.kg_asignados) + " kg" : "pendiente"}</div>
      <div class="hace">${haceTexto(a.creado_en)}</div>
    </div>
  `).join("")}</div>`;
}

async function cargarDatos() {
  try {
    const corridas = await apiGet("/api/corridas");
    const activas = corridas.filter((c) => c.fecha_final === null);
    const corrida = activas[0] || null;

    if (!corrida) {
      estado = { corrida: null, registros: [], paradaActiva: null };
      renderizar();
      return;
    }

    const [registros, paradas] = await Promise.all([
      apiGet(`/api/corridas/${corrida.id}/asignaciones`),
      apiGet(`/api/corridas/${corrida.id}/paradas`),
    ]);
    estado = {
      corrida,
      registros: registros.slice(0, 5),
      paradaActiva: paradas.find((p) => p.hora_fin === null) || null,
    };
    renderizar();
  } catch (e) {
    document.getElementById("contenidoCorrida").innerHTML =
      `<div class="vacio">No se pudo actualizar (${escapeHtml(e.message)}) — reintentando…</div>`;
  }
}

actualizarReloj();
setInterval(actualizarReloj, 1000);
setInterval(renderizar, 1000);
cargarDatos();
setInterval(cargarDatos, REFRESCO_DATOS_MS);
</script>
</body>
</html>
