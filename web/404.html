<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Página no encontrada · Agromar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
  .err-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .err-card{max-width:440px;width:100%;text-align:center}
  .err-code{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:64px;color:var(--citrus);line-height:1}
</style>
</head>
<body style="background:var(--bg)">

<div class="err-wrap">
  <div class="panel err-card">
    <div class="form-body">
      <div class="mark" style="justify-content:center;display:flex;margin-bottom:18px">
        <span class="agro">agro</span><span class="dot"></span><span class="mar">mar</span>
      </div>
      <div class="err-code">404</div>
      <h2 style="margin:10px 0 6px">Esta página no existe</h2>
      <p class="hint-line" style="margin-bottom:22px">Revisa el link, o vuelve al Tablero.</p>
      <a class="btn" href="/tablero.html" style="display:inline-block;width:auto;padding:11px 26px;text-decoration:none">Ir al Tablero</a>
    </div>
  </div>
</div>

</body>
</html>
